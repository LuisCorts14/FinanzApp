services:
  db:
    image: postgres:16
    container_name: finanzapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finanzapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finanzapp}
      POSTGRES_DB: ${POSTGRES_DB:-finanzapp}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - finanzapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finanzapp}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finanzapp_pgdata:
    name: finanzapp_pgdata
